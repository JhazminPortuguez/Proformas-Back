services:
  postgres:
    image: postgres:17
    container_name: proformas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: proformas
      POSTGRES_USER: proformas
      POSTGRES_PASSWORD: proformas
      TZ: America/La_Paz
      PGTZ: America/La_Paz
    ports:
      - "5434:5432"
    volumes:
      - proformas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proformas -d proformas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proformas_pgdata:

name: CI PostgreSQL 17

on:
  push:
  pull_request:

jobs:
  test-pgsql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: proformas_test
          POSTGRES_USER: proformas
          POSTGRES_PASSWORD: proformas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proformas -d proformas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: proformas_test
      DB_USERNAME: proformas
      DB_PASSWORD: proformas

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql, bcmath, dom, mbstring, gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migraciones PostgreSQL
        run: php artisan migrate --force

      - name: Tests PostgreSQL
        run: php vendor/bin/phpunit --configuration=phpunit.pgsql.xml

      - name: Estilo
        run: php vendor/bin/pint --test
